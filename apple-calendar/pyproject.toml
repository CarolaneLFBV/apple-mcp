[project]
name = "apple-calendar-mcp"
version = "0.1.0"
description = "MCP server for Apple Calendar (Calendar.app) on macOS — read, create, update and delete events via AppleScript, targeting your named calendars."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Carolane Lefebvre" }]
keywords = ["mcp", "apple", "calendar", "macos", "applescript", "claude", "model-context-protocol"]
classifiers = [
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/CarolaneLFBV/apple-mcp"
Repository = "https://github.com/CarolaneLFBV/apple-mcp"
Issues = "https://github.com/CarolaneLFBV/apple-mcp/issues"

[project.scripts]
apple-calendar-mcp = "apple_calendar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_calendar_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
